# ============================================================================
# CT2MAP-HN: Preprocessing Configuration
# Cấu hình tiền xử lý ảnh CT/PET/Mask cho head-neck cancer
# ============================================================================

preprocess:
  # --- I/O Directories ---
  input_dir: /data/lowngworkspace/hecktor_raw
  output_dir: data/processed

  # --- Resampling ---
  # Target isotropic spacing in mm [x, y, z]
  # 1mm isotropic is standard for head-neck CT analysis
  target_spacing: [1.0, 1.0, 1.0]

  # --- Intensity Processing ---
  # HU window clipping [min, max]
  # [-200, 300] covers soft tissue and bone relevant for head-neck
  hu_clip: [-200, 300]

  # Normalization method after clipping:
  #   minmax : Scale to [0, 1] range
  #   zscore : Zero-mean, unit-variance normalization
  normalize_method: minmax

  # --- Cropping ---
  # Crop method:
  #   body        : CT-ONLY head-neck ROI (H1 fix, RECOMMENDED). Body mask from
  #                 HU threshold + fixed superior z-window from top-of-head.
  #                 Reproducible at inference (needs NO GT mask).
  #   bbox        : Tight bbox around the GT LESION mask. NOT reproducible at
  #                 inference (mask unavailable) — legacy comparison only.
  #   fixed_size  : Fixed crop_size centered on the GT lesion mask. Same
  #                 inference limitation as bbox.
  crop_method: body

  # In-plane (y, x) margin around the body bbox in voxels [z, y, x].
  # z entry is ignored by the 'body' method (z is governed by z_extent_mm).
  crop_margin: [10, 10, 10]

  # Fixed crop size in voxels [D, H, W] — only used by crop_method=fixed_size.
  crop_size: [192, 192, 192]

  # --- body crop parameters (crop_method=body) ---
  # HU threshold separating body (soft tissue/bone) from surrounding air.
  crop_hu_threshold: -500.0

  # Superior→inferior head-neck window length in mm, measured down from the
  # top-of-head landmark. Cohort check (149 cases): deepest GTV sits ~311 mm
  # below top-of-head; 360 mm keeps all lesions with ~50 mm safety margin.
  crop_z_extent_mm: 360.0

  # --- Orientation ---
  # Reorient all images to standard orientation
  # RAS = Right-Anterior-Superior (radiological standard)
  orientation: RAS

  # --- Processing ---
  # Number of parallel workers for preprocessing
  # Recommended: num_physical_cores / 2 (EPYC 7743P has 64 cores)
  num_workers: 8

  # Whether to overwrite existing processed files
  overwrite: false
