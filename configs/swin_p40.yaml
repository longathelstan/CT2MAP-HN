# ============================================================================
# CT2MAP-HN: Swin UNETR Configuration (Student)
# Optimized for 2× NVIDIA Tesla P40 (24GB VRAM each)
# Hyperparameters preserved from original swin_unetr.yaml
# Schema matches code expectations (train_swin.py + engine.py)
# ============================================================================

seed: 42

# --- Model Architecture ---
model:
  name: swin_unetr_student
  img_size: [128, 128, 128]
  in_channels: 1
  out_channels: 1
  feature_size: 48
  patch_size: [2, 2, 2]
  window_size: [7, 7, 7]
  depths: [2, 2, 6, 2]
  num_heads: [3, 6, 12, 24]
  mlp_ratio: 4.0
  dropout_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  qkv_bias: true
  final_activation: sigmoid
  norm_layer: instance
  use_checkpoint: true
  pretrained: null

# --- Optimizer (top-level section) ---
optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4

# --- Scheduler (top-level section) ---
scheduler:
  name: cosine
  warmup_epochs: 20
  eta_min: 1.0e-7

# --- Loss (top-level section) ---
loss:
  w_heatmap: 1.0
  w_lesion: 1.0
  w_triage: 0.0
  heatmap:
    base: l1
    use_focal: true
    focal_gamma: 2.0
    lesion_weight: 10.0
  lesion:
    bce_weight: 1.0
    dice_weight: 1.0
    use_focal: true

# --- Training ---
training:
  num_epochs: 500
  batch_size: 1          # Per GPU — Swin UNETR is memory-heavy
  use_amp: true
  clip_grad_norm: 1.0
  grad_accumulation_steps: 2    # Effective batch = 1 × 2 GPUs × 2 accum = 4
  val_interval: 1
  save_interval: 50
  early_stop_patience: 50

# --- Data Loading ---
data:
  config: configs/data.yaml
  batch_size: 1
  num_workers: 8
  pin_memory: true
  augmentation:
    random_flip_prob: 0.5
    patch_size: [128, 128, 128]
  val_patch_size: [128, 128, 128]

# --- Paths ---
paths:
  checkpoint_dir: checkpoints/swin_p40
  tensorboard_dir: runs/swin_p40
  metrics_dir: results

# --- Logging ---
logging:
  level: INFO
